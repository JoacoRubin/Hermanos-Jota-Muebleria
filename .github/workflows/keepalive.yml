name: Keep Render Service Alive

on:
  schedule:
    # Render duerme el servicio tras 15 min de inactividad.
    # Corre las 24hs: los repos públicos tienen minutos de GitHub Actions
    # ilimitados y gratis, así que restringir el horario no ahorraba nada
    # y solo dificultaba diagnosticar si el ping estaba funcionando.
    #
    # ⚠️ OJO con lo que este intervalo promete. Los cron de GitHub Actions son
    # best-effort: se retrasan cuando la cola está cargada, y en este repo se
    # midieron corridas separadas por 58 y 71 MINUTOS con un cron de */10.
    # O sea que el número de acá es un pedido, no una garantía.
    - cron: '*/14 * * * *'
  workflow_dispatch:

# El RAG (Cloud Run) NO se pinguea desde acá, a propósito.
#
# Estuvo un rato: se agregó como segundo servicio en una matrix. Pero Cloud Run
# escala a CERO a los ~15 min —está en los logs: `Shutting down` 15 minutos
# justos después del último request— y con GitHub disparando cada ~65 min real,
# el RAG quedaba dormido el 75% del tiempo. Un keepalive que llega tarde no es
# un keepalive, es una ilusión de cobertura.
#
# Ahora lo despierta **Cloud Scheduler** (`rag-keepalive`, southamerica-east1,
# cada 10 min), que sí es puntual porque es infraestructura de GCP y no una cola
# compartida con el mundo. Entra en el free tier: 3 jobs por mes sin cargo.
#
#   gcloud scheduler jobs describe rag-keepalive --location=southamerica-east1
#
# El cold start del RAG medido en producción fue de ~35s contra ~1s caliente, así
# que la diferencia entre pinguearlo bien o mal la paga el primer usuario del día.

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al health check
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          set -euo pipefail

          # Antes había un fallback a 'https://tu-app.onrender.com': si el
          # secret no estaba cargado, el workflow pingueaba un dominio ajeno
          # y salía en verde. Un check que no puede fallar no sirve de nada.
          if [ -z "${RENDER_URL}" ]; then
            echo "::error::Falta el secret RENDER_URL (Settings → Secrets and variables → Actions)."
            exit 1
          fi

          echo "Pingueando ${RENDER_URL}/health"

          CODIGO=$(curl -s -o /tmp/respuesta.json -w "%{http_code}" \
            --max-time 90 --retry 2 --retry-delay 15 \
            "${RENDER_URL}/health" || echo "000")

          echo "Código de respuesta: ${CODIGO}"
          cat /tmp/respuesta.json 2>/dev/null || true
          echo

          if [ "${CODIGO}" != "200" ]; then
            echo "::warning::El servicio no respondió 200 (puede estar arrancando)."
          else
            echo "Servicio activo."
          fi
