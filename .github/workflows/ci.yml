name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancela ejecuciones viejas de la misma rama: no tiene sentido gastar
# minutos validando un commit que ya quedó atrás.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # La versión sale de `backend/.node-version`, el MISMO archivo que lee
      # Render. Tenerla escrita acá como número suelto es cómo se llega a
      # testear en una versión y desplegar en otra: pasó, y producción corrió
      # seis majors por delante de la suite durante varios deploys.
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        # mongodb-memory-server descarga un binario de mongod la primera vez.
        run: npm test

  client:
    name: Client — lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      # Ídem: `client/.node-version` es el que también lee Netlify.
      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.node-version
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
